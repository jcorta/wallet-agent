[project]
name = "idp"
version = "0.1.0"
description = "Toy identity provider: password login and JWKS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
