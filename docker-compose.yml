name: wallet-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  idp:
    build: ./idp
    environment:
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      USER1_USERNAME: ${USER1_USERNAME}
      USER1_PASSWORD: ${USER1_PASSWORD}
      USER1_ID: ${USER1_ID}
      USER2_USERNAME: ${USER2_USERNAME}
      USER2_PASSWORD: ${USER2_PASSWORD}
      USER2_ID: ${USER2_ID}
    ports:
      - "8001:8000"
    volumes:
      - idp-keys:/data

volumes:
  pgdata:
  idp-keys:
