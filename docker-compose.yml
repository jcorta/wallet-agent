name: wallet-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  idp:
    build: ./idp
    environment:
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      USER1_USERNAME: ${USER1_USERNAME}
      USER1_PASSWORD: ${USER1_PASSWORD}
      USER1_ID: ${USER1_ID}
      USER2_USERNAME: ${USER2_USERNAME}
      USER2_PASSWORD: ${USER2_PASSWORD}
      USER2_ID: ${USER2_ID}
    ports:
      - "8001:8000"
    volumes:
      - idp-keys:/data

  wallet-api:
    build: ./wallet-api
    environment:
      DATABASE_URL: postgresql+psycopg://wallet_svc:${WALLET_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWKS_URL: http://idp:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      USER1_ID: ${USER1_ID}
      USER2_ID: ${USER2_ID}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      idp:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://agent_svc:${AGENT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WALLET_API_URL: http://wallet-api:8000
      JWKS_URL: http://idp:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      wallet-api:
        condition: service_healthy
      idp:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      IDP_URL: http://idp:8000
      AGENT_URL: http://agent-service:8000
    ports:
      - "8501:8501"
    depends_on:
      idp:
        condition: service_healthy
      agent-service:
        condition: service_healthy

volumes:
  pgdata:
  idp-keys:
