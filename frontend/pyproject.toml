[project]
name = "frontend"
version = "0.1.0"
description = "Streamlit chat client for the wallet assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
